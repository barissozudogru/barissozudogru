name: Metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The counts include private repositories, so this needs a token that can
      # see them. Without one the figures would be wrong in the same direction
      # as the widget this replaced.
      - name: Regenerate the panel
        run: python3 .github/panel.py metrics.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain metrics.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add metrics.svg
            git commit -m "Update metrics panel"
            git push
          fi
