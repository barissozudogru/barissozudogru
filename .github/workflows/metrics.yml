name: Metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      # The counts include private repositories, so this needs a token that can
      # see them. Without one the figures would be wrong in the same direction
      # as the widget this replaced.
      - name: Regenerate the panel
        run: python3 .github/panel.py .
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      # GitHub proxies these images and caches by URL, so a changed file at the
      # same path keeps serving the old picture. The hash in the query string
      # makes each regeneration a new URL.
      - name: Point the README at the new content
        run: |
          H=$(sha256sum metrics-dark.svg | cut -c1-8)
          sed -i -E "s/\?v=[0-9a-f]{8}/?v=$H/g" README.md

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain metrics-dark.svg metrics-light.svg README.md)" ]; then
            git config user.name "Baris Sozudogru"
            git config user.email "barissozudogru@users.noreply.github.com"
            git add metrics-dark.svg metrics-light.svg README.md
            git commit -m "Update metrics panel"
            git push
          fi
